<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JugáPY</title>
<style>
:root{--teal:#0f766e;--teal-d:#115e59;--teal-l:#ccfbf1;--or:#c2410c;--or-l:#ffedd5;--ink:#0f172a;--mut:#475569;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#cbd5e1;color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.phone{width:100%;max-width:410px;height:min(860px,calc(100vh - 32px));background:var(--bg);border-radius:30px;box-shadow:0 20px 60px rgba(15,23,42,.35);overflow:hidden;display:flex;flex-direction:column;position:relative;border:8px solid #0f172a}
@media(max-width:440px){body{padding:0;background:var(--bg)}.phone{max-width:none;height:100vh;border-radius:0;border:none;box-shadow:none}}
header{background:var(--teal);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:19px;letter-spacing:.2px;flex:1}
header .back{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
header .avatar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--teal);font-weight:700;border:0;cursor:pointer;font-size:14px}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button{padding:13px 0 12px;font-size:12px}nav button.on{border-top:3px solid var(--teal);padding-top:10px}
nav button.on{color:var(--teal);font-weight:700}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:14px;margin:14px 0 8px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.07)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;background:#fff;margin-bottom:10px;font-family:inherit}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;width:100%}
.btn.or{background:var(--or)}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{background:#cbd5e1;color:#fff;cursor:not-allowed}
.photo{height:96px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:8px}
.photo.big{height:150px;font-size:70px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal-d);margin-right:4px;margin-top:4px}
.tag.or{background:var(--or-l);color:#9a3412}
.stars{color:#f59e0b;font-size:13px}
.price{font-weight:700;color:var(--teal-d)}
.hero{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:19px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.quick{background:#fff;border-radius:14px;padding:22px 8px;text-align:center;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.07)}
.quick .ic{font-size:26px;display:block;margin-bottom:4px}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps div{flex:1;text-align:center;font-size:10.5px;color:var(--mut);border-top:3px solid var(--line);padding-top:4px}
.steps div.done{color:var(--teal);border-color:var(--teal);font-weight:700}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.day{min-width:54px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 4px;cursor:pointer;font-size:12px}
.day b{display:block;font-size:16px}
.day.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.slot{border:1.5px solid var(--teal);color:var(--teal-d);background:#fff;border-radius:10px;padding:9px 0;text-align:center;font-weight:600;font-size:14px;cursor:pointer}
.slot.on{background:var(--teal);color:#fff}
.slot.busy{border-color:var(--line);color:#94a3b8;background:#f8fafc;text-decoration:line-through;cursor:not-allowed}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.sum:last-child{border:0;font-weight:700}
.pay{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.pay.on{border-color:var(--teal);background:var(--teal-l)}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:56px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:2px;background:#fff;border:2px dashed var(--teal);border-radius:12px;padding:10px;margin:12px 0;color:var(--teal-d);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
.mini-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.msg{max-width:78%;padding:8px 11px;border-radius:14px;font-size:14px;background:#fff}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff}
.compose{display:flex;gap:8px}
.compose input{margin:0}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:9;max-width:85%;text-align:center;animation:f .25s}
@keyframes f{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.badge{background:var(--or);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:3px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--or)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <header><button class="back" id="back" style="display:none" aria-label="Volver">←</button><h1 id="title">JugáPY</h1><button class="avatar" id="avatar" aria-label="Mi perfil">GS</button></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script>
/* ============ DATOS DE EJEMPLO ============ */
const SPORTS = {futbol:{n:"Fútbol",e:"⚽"},padel:{n:"Pádel",e:"🎾"},voley:{n:"Vóley",e:"🏐"},basquet:{n:"Básquet",e:"🏀"},tenis:{n:"Tenis",e:"🥎"}};
const COURTS = [
  {id:1,name:"Complejo Los Pinos",sport:"futbol",zone:"Villa Morra, Asunción",price:140000,rating:4.7,n:86,tags:["Césped sintético","Vestuarios","Estacionamiento"],c:["#bbf7d0","#4ade80"],desc:"Cancha de fútbol 5 con césped sintético de última generación, iluminación LED y quincho para el tercer tiempo.",rev:[["Marcos A.",5,"Excelente césped y muy buena iluminación."],["Lucía P.",4,"Lindo lugar, el estacionamiento es chico."]]},
  {id:2,name:"Pádel Club Sajonia",sport:"padel",zone:"Sajonia, Asunción",price:100000,rating:4.8,n:124,tags:["Techada","Alquiler de palas","Bar"],c:["#bae6fd","#38bdf8"],desc:"Tres canchas de pádel de cristal, techadas, con bar y alquiler de palas y pelotas.",rev:[["Diego R.",5,"Las mejores canchas de pádel de la zona."],["Ana M.",5,"Atención excelente y siempre impecable."]]},
  {id:3,name:"Arena Fútbol 7 Lambaré",sport:"futbol",zone:"Lambaré",price:180000,rating:4.4,n:51,tags:["Fútbol 7","Parrilla","Iluminación"],c:["#d9f99d","#84cc16"],desc:"Cancha de fútbol 7 con tribuna chica y parrilla. Ideal para torneos entre amigos.",rev:[["Nico F.",4,"Buena cancha, a veces se llena."]]},
  {id:4,name:"Smash Pádel San Lorenzo",sport:"padel",zone:"San Lorenzo",price:90000,rating:4.5,n:67,tags:["Descubierta","Estacionamiento"],c:["#fde68a","#f59e0b"],desc:"Canchas de pádel al aire libre con muy buena iluminación nocturna.",rev:[["Carla G.",5,"Precio justo y buena onda."],["Tomás B.",4,"Se puede mejorar el vestuario."]]},
  {id:5,name:"Vóley Playa Costanera",sport:"voley",zone:"Costanera, Asunción",price:70000,rating:4.6,n:39,tags:["Arena","Duchas"],c:["#fed7aa","#fb923c"],desc:"Cancha de vóley de arena con vista al río, duchas y buffet.",rev:[["Romina S.",5,"Un lujo jugar acá al atardecer."]]},
  {id:6,name:"Polideportivo Luque",sport:"basquet",zone:"Luque",price:80000,rating:4.3,n:28,tags:["Techado","Vestuarios"],c:["#fecaca","#f87171"],desc:"Cancha de básquet techada con piso de parquet y tableros reglamentarios.",rev:[["Julián C.",4,"Muy buen piso y tableros."]]},
  {id:7,name:"Tenis Club Fernando",sport:"tenis",zone:"Fernando de la Mora",price:60000,rating:4.2,n:33,tags:["Polvo de ladrillo","Alquiler de raquetas"],c:["#fbcfe8","#f472b6"],desc:"Canchas de tenis de polvo de ladrillo con profesores disponibles.",rev:[["Patricia L.",4,"Canchas bien cuidadas."]]},
  {id:8,name:"Fútbol 5 La Terraza",sport:"futbol",zone:"Mburucuyá, Asunción",price:120000,rating:4.6,n:72,tags:["Fútbol 5","Bar","WiFi"],c:["#a7f3d0","#34d399"],desc:"Cancha de fútbol 5 techada, con bar y pantalla para ver partidos.",rev:[["Sebas V.",5,"Techada, ideal para días de lluvia."]]},
];
const TOURN0 = [
  {id:1,name:"Copa Asunción Fútbol 5",sport:"futbol",place:"Complejo Los Pinos",date:"22 nov",fee:250000,cap:16,taken:13,teams:["Los Cracks","Tigres FC","Deportivo Sur","Real Villa","Atlético Sajonia","Los Pibes","FC Mburucuyá","Halcones"],fmt:"Liga + final"},
  {id:2,name:"Torneo Pádel Relámpago",sport:"padel",place:"Pádel Club Sajonia",date:"29 nov",fee:120000,cap:16,taken:9,teams:["Díaz/Rojas","López/Vera","Benítez/Cano","Giménez/Paz","Ortiz/Silva","Acosta/Mora","Torres/Ruiz","Aquino/Fleitas"],fmt:"Eliminación directa"},
  {id:3,name:"Copa Vóley Costanera",sport:"voley",place:"Vóley Playa Costanera",date:"6 dic",fee:80000,cap:8,taken:8,teams:["Arena Team","Las Gaviotas","Costa Norte","Solimar","Net Breakers","Dunas","Marea","Brisa"],fmt:"Liga"},
];
const PEOPLE0 = [
  {id:1,name:"Marcos Alvarenga",sport:"futbol",lvl:"Intermedio",zone:"Asunción",c:"#0f766e",f:false,bio:"Arquero. Busco equipo para jugar los jueves."},
  {id:2,name:"Lucía Páez",sport:"padel",lvl:"Avanzado",zone:"Villa Morra",c:"#ea580c",f:false,bio:"Juego pádel 3 veces por semana. Busco pareja."},
  {id:3,name:"Diego Rojas",sport:"futbol",lvl:"Principiante",zone:"Lambaré",c:"#2563eb",f:false,bio:"Recién empiezo, me gusta jugar por diversión."},
  {id:4,name:"Carla Giménez",sport:"voley",lvl:"Intermedio",zone:"Costanera",c:"#9333ea",f:true,bio:"Vóley de playa los fines de semana."},
  {id:5,name:"Tomás Benítez",sport:"basquet",lvl:"Avanzado",zone:"Luque",c:"#dc2626",f:false,bio:"Base. Armamos equipo para un torneo."},
];
const OPEN0 = [
  {id:1,sport:"futbol",title:"Fútbol 5 – faltan 2 jugadores",where:"La Terraza",when:"Hoy 20:00",need:2,lvl:"Intermedio",joined:false},
  {id:2,sport:"padel",title:"Pádel – falta 1 jugador",where:"Pádel Club Sajonia",when:"Sáb 18:00",need:1,lvl:"Avanzado",joined:false},
  {id:3,sport:"voley",title:"Vóley playa – faltan 3",where:"Costanera",when:"Dom 17:00",need:3,lvl:"Todos",joined:false},
];
const CHATS0 = {
  1:[["them","Hola! Vi que buscás equipo, nos falta arquero."],["them","Jugamos los jueves a las 21 en Los Pinos."]],
  2:[["them","¿Jugamos pádel el sábado?"]],
  "team":[["them","Recordatorio: partido mañana 20:00. Confirmen asistencia."],["them","Yo llevo las pecheras."]],
};

/* ============ ESTADO ============ */
const S = {
  screen:"home", stack:[], sport:"all", tsport:"all", q:"", court:null, day:0, slot:null, pay:"tarjeta",
  bookings:[], tourn:JSON.parse(JSON.stringify(TOURN0)), joinedT:[], tab:"fixture",
  people:JSON.parse(JSON.stringify(PEOPLE0)), open:JSON.parse(JSON.stringify(OPEN0)),
  chats:JSON.parse(JSON.stringify(CHATS0)), chatWith:null, cTab:"jug", lastCode:null, pTab:"res", user:null, aTab:"in", err:{},
};
const NAV = [["home","","Inicio"],["courts","","Canchas"],["tourns","","Torneos"],["comm","","Comunidad"]];
const $ = s => document.querySelector(s);
const gs = n => n.toLocaleString("es-PY").replace(/,/g,".") + " Gs";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars = r => "★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;$("#phone").appendChild(e);setTimeout(()=>e.remove(),2200)}

/* disponibilidad determinística por cancha y día */
const HOURS=[16,17,18,19,20,21,22];
const dayDate = n => {const d=new Date();d.setDate(d.getDate()+n);return d};
const dayKey = n => dayDate(n).toISOString().slice(0,10);
function busy(cid,day,h){
  if(S.bookings.some(b=>b.cid===cid&&b.day===day&&b.h===h))return true;
  const x=(cid*31+day*17+h*7)%10;return x<3;
}
const DN=["dom","lun","mar","mié","jue","vie","sáb"];

/* ============ NAVEGACIÓN ============ */
function go(s,push=true){if(push)S.stack.push(S.screen);S.screen=s;render()}
function back(){S.screen=S.stack.pop()||"home";render()}
function tab(s){S.stack=[];S.screen=s;render()}
$("#back").onclick=back;
$("#avatar").onclick=()=>go("profile");

const ini=n=>n.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
function render(){
  if(!S.user)S.screen="login";
  const sc=S.screen,t={login:"JugáPY",home:"JugáPY",courts:"Canchas",court:"Detalle de cancha",book:"Reservar",pay:"Pago",done:"Confirmación",tourns:"Torneos",tourn:"Detalle de torneo",comm:"Comunidad",chat:"Chat",profile:"Mi perfil",player:"Perfil de jugador"}[sc];
  $("#title").textContent=t;
  $("#back").style.display=["login","home","courts","tourns","comm"].includes(sc)?"none":"";
  $("#avatar").style.display=sc==="login"?"none":"";
  if(S.user)$("#avatar").textContent=ini(S.user.name);
  const root={court:"courts",book:"courts",pay:"courts",done:"courts",tourn:"tourns",chat:"comm",player:"comm",profile:"home"}[sc]||sc;
  $("#nav").style.display=sc==="login"?"none":"";
  $("#nav").innerHTML=NAV.map(([k,i,l])=>`<button class="${k===root?"on":""}" onclick="tab('${k}')"><span class="ic">${i}</span>${l}</button>`).join("");
  $("#main").innerHTML=V[sc]();
  $("#main").scrollTop=0;
  if(sc==="chat"){const m=$(".msgs");if(m)m.scrollTop=m.scrollHeight}
}

/* ============ VISTAS ============ */
const courtCard=c=>`<div class="card" onclick="openCourt(${c.id})" style="cursor:pointer"><div class="photo" style="background:linear-gradient(135deg,${c.c[0]},${c.c[1]})">${SPORTS[c.sport].e}</div><div class="row"><b>${esc(c.name)}</b><span class="sp"></span><span class="price">${gs(c.price)}/h</span></div><div class="mut">${esc(c.zone)} · <span class="stars">${stars(c.rating)}</span> ${c.rating} (${c.n})</div><div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div>`;

const fe=k=>S.err[k]?`<div style="color:var(--red);font-size:12px;margin:-6px 0 8px">${S.err[k]}</div>`:"";
const V={
login(){
  const up=S.aTab==="up",v=S.form||{};
  return `<div style="text-align:center;padding:18px 0 14px"><div style="width:64px;height:64px;border-radius:18px;background:var(--teal);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px">J</div><h2 style="margin:0;font-size:22px">JugáPY</h2><div class="mut">Canchas, torneos y gente para jugar</div></div>
  <div class="seg"><button class="${!up?"on":""}" onclick="S.aTab='in';S.err={};render()">Ingresar</button><button class="${up?"on":""}" onclick="S.aTab='up';S.err={};render()">Crear cuenta</button></div>
  ${up?`<input type="text" id="f-name" placeholder="Nombre y apellido" value="${esc(v.name||"")}">${fe("name")}`:""}
  <input type="text" id="f-mail" placeholder="Correo electrónico" value="${esc(v.mail||"")}">${fe("mail")}
  <input type="password" id="f-pass" placeholder="Contraseña (mínimo 6 caracteres)" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;margin-bottom:10px;font-family:inherit">${fe("pass")}
  ${up?`<select id="f-sport"><option value="">Deporte favorito</option>${Object.values(SPORTS).map(x=>`<option>${x.n}</option>`).join("")}</select>${fe("sport")}`:""}
  <button class="btn" onclick="auth()">${up?"Crear cuenta":"Ingresar"}</button>
  <div class="mut" style="margin-top:12px;text-align:center">Prototipo: se acepta cualquier correo válido y una contraseña de 6 o más caracteres. No se guarda ningún dato.</div>`;
},
home(){
  const my=S.bookings.slice(-1)[0];
  return `<div class="hero"><h2>Hola, ${esc(S.user.name.split(" ")[0])}</h2><div style="font-size:13.5px;opacity:.95">Reservá tu cancha, anotate en un torneo y encontrá con quién jugar.</div></div>
  <div class="grid4">
    <div class="quick" onclick="tab('courts')">Reservar cancha</div>
    <div class="quick" onclick="tab('tourns')">Torneos</div>
    <div class="quick" onclick="S.cTab='open';tab('comm')">Partidos abiertos</div>
    <div class="quick" onclick="tab('comm')">Conocer gente</div>
  </div>
  <h3>Tu próximo partido</h3>
  ${my?`<div class="card"><b>${esc(my.name)}</b><div class="mut">${my.label} · ${my.h}:00 hs</div><span class="tag">Reserva ${my.code}</span></div>`:`<div class="card mut">Todavía no tenés reservas. Reservá tu primera cancha desde Canchas.</div>`}
  <h3>Canchas destacadas</h3>
  ${COURTS.filter(c=>c.rating>=4.7).map(courtCard).join("")}`;
},
courts(){
  const list=COURTS.filter(c=>(S.sport==="all"||c.sport===S.sport)&&(c.name+c.zone).toLowerCase().includes(S.q.toLowerCase()));
  return `<input type="text" id="q" placeholder="Buscar por nombre o zona" value="${esc(S.q)}" oninput="S.q=this.value;upd()">
  <div class="chips"><div class="chip ${S.sport==="all"?"on":""}" onclick="S.sport='all';render()">Todos</div>${Object.entries(SPORTS).map(([k,v])=>`<div class="chip ${S.sport===k?"on":""}" onclick="S.sport='${k}';render()">${v.e} ${v.n}</div>`).join("")}</div>
  <div id="list">${list.length?list.map(courtCard).join(""):`<div class="card mut">No hay canchas que coincidan con tu búsqueda.</div>`}</div>`;
},
court(){
  const c=S.court;
  return `<div class="photo big" style="background:linear-gradient(135deg,${c.c[0]},${c.c[1]})">${SPORTS[c.sport].e}</div>
  <h2>${esc(c.name)}</h2><div class="mut">${esc(c.zone)}</div>
  <div class="row" style="margin:6px 0"><span class="stars">${stars(c.rating)}</span><b>${c.rating}</b><span class="mut">(${c.n} reseñas)</span><span class="sp"></span><span class="price">${gs(c.price)}/h</span></div>
  <div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  <p style="margin:10px 0;font-size:14px;line-height:1.5">${esc(c.desc)}</p>
  <button class="btn" onclick="S.day=0;S.slot=null;go('book')">Reservar horario</button>
  <h3>Reseñas</h3>${c.rev.map(r=>`<div class="card"><div class="row"><b style="font-size:14px">${esc(r[0])}</b><span class="sp"></span><span class="stars">${stars(r[1])}</span></div><div class="mut" style="margin-top:4px">${esc(r[2])}</div></div>`).join("")}`;
},
book(){
  const c=S.court;
  const days=[0,1,2,3,4,5,6].map(n=>{const d=dayDate(n);return `<div class="day ${S.day===n?"on":""}" onclick="S.day=${n};S.slot=null;render()">${DN[d.getDay()]}<b>${d.getDate()}</b></div>`}).join("");
  return `<div class="steps"><div class="done">1. Cancha</div><div class="done">2. Horario</div><div>3. Pago</div><div>4. Listo</div></div>
  <div class="card"><b>${esc(c.name)}</b><div class="mut">${gs(c.price)} por hora</div></div>
  <h3>Elegí el día</h3><div class="days">${days}</div>
  <h3>Elegí la franja horaria</h3>
  <div class="slots">${HOURS.map(h=>{const b=busy(c.id,S.day,h);return `<div class="slot ${b?"busy":""} ${S.slot===h?"on":""}" ${b?"":`onclick="S.slot=${h};render()"`}>${h}:00</div>`}).join("")}</div>
  <div class="mut" style="margin-bottom:10px">Las franjas tachadas ya están reservadas.</div>
  <button class="btn" ${S.slot===null?"disabled":""} onclick="go('pay')">Continuar al pago</button>`;
},
pay(){
  const c=S.court,seña=Math.round(c.price*.3),d=dayDate(S.day);
  return `<div class="steps"><div class="done">1. Cancha</div><div class="done">2. Horario</div><div class="done">3. Pago</div><div>4. Listo</div></div>
  <div class="card"><div class="sum"><span>Cancha</span><span>${esc(c.name)}</span></div><div class="sum"><span>Fecha</span><span>${DN[d.getDay()]} ${d.getDate()}/${d.getMonth()+1} · ${S.slot}:00</span></div><div class="sum"><span>Total reserva</span><span>${gs(c.price)}</span></div><div class="sum"><span>Seña a pagar ahora (30 %)</span><span>${gs(seña)}</span></div></div>
  <h3>Método de pago</h3>
  ${[["tarjeta","","Tarjeta de crédito o débito"],["billetera","","Billetera móvil"],["transf","","Transferencia bancaria"]].map(([k,i,l])=>`<div class="pay ${S.pay===k?"on":""}" onclick="S.pay='${k}';render()"><b style="font-size:14px">${l}</b></div>`).join("")}
  <div class="mut" style="margin:8px 0 12px">Pago simulado: en este prototipo no se realiza ningún cobro real.</div>
  <button class="btn or" onclick="confirmPay()">Pagar ${gs(seña)}</button>`;
},
done(){
  const b=S.bookings.slice(-1)[0];
  return `<div class="steps"><div class="done">1. Cancha</div><div class="done">2. Horario</div><div class="done">3. Pago</div><div class="done">4. Listo</div></div>
  <div class="ok"><div class="big" style="color:var(--green)">✓</div><h2>Reserva confirmada</h2><div class="mut">${esc(b.name)}<br>${b.label} · ${b.h}:00 hs</div><div class="code">${b.code}</div><div class="mut">Mostrá este código en la recepción.</div></div>
  <button class="btn" style="margin-bottom:8px" onclick="toast('Invitación enviada a tus amigos')">Invitar jugadores</button>
  <button class="btn ghost" onclick="tab('home')">Volver al inicio</button>`;
},
tourns(){
  return `<div class="chips"><div class="chip ${S.tsport==="all"?"on":""}" onclick="S.tsport='all';render()">Todos</div>${Object.entries(SPORTS).filter(([k])=>["futbol","padel","voley"].includes(k)).map(([k,v])=>`<div class="chip ${S.tsport===k?"on":""}" onclick="S.tsport='${k}';render()">${v.e} ${v.n}</div>`).join("")}</div>`+
  S.tourn.filter(t=>S.tsport==="all"||t.sport===S.tsport).map(t=>{const full=t.taken>=t.cap,joined=S.joinedT.includes(t.id);return `<div class="card" onclick="openT(${t.id})" style="cursor:pointer"><div class="row"><span style="font-size:28px">${SPORTS[t.sport].e}</span><div class="sp"><b>${esc(t.name)}</b><div class="mut">${t.date} · ${esc(t.place)}</div></div></div><div class="bar"><i style="width:${t.taken/t.cap*100}%"></i></div><div class="row" style="margin-top:6px"><span class="mut">${t.taken}/${t.cap} equipos</span><span class="sp"></span>${joined?`<span class="tag">Inscripto</span>`:full?`<span class="tag or">Sin cupos</span>`:`<span class="tag or">Inscripción abierta</span>`}</div></div>`}).join("");
},
tourn(){
  const t=S.T,full=t.taken>=t.cap,joined=S.joinedT.includes(t.id);
  const tm=[...t.teams];if(joined)tm.push("Mi equipo (Los Pibes de JugáPY)");
  const fix=[];const pts={};tm.forEach(n=>pts[n]=0);
  for(let i=0;i<tm.length-1;i+=2){const a=tm[i],b=tm[i+1];fix.push([a,b,i/2<2?[3,1]:null]);}
  fix.slice(0,2).forEach(f=>{pts[f[0]]+=3});
  const tabla=Object.entries(pts).sort((a,b)=>b[1]-a[1]);
  return `<div class="card"><div class="row"><span style="font-size:32px">${SPORTS[t.sport].e}</span><div><b>${esc(t.name)}</b><div class="mut">${t.date} · ${esc(t.place)}</div></div></div>
  <div style="margin-top:8px"><span class="tag">${t.fmt}</span><span class="tag or">Cuota ${gs(t.fee)}</span><span class="tag">${t.taken}/${t.cap} equipos</span></div></div>
  ${joined?`<div class="card" style="background:var(--teal-l);color:var(--teal-d)"><b>Tu equipo está inscripto</b></div>`:`<button class="btn or" ${full?"disabled":""} onclick="joinT(${t.id})">${full?"Sin cupos":"Inscribir a mi equipo · "+gs(t.fee)}</button>`}
  <div class="seg" style="margin-top:12px"><button class="${S.tab==="fixture"?"on":""}" onclick="S.tab='fixture';render()">Fixture</button><button class="${S.tab==="tabla"?"on":""}" onclick="S.tab='tabla';render()">Posiciones</button></div>
  ${S.tab==="fixture"?fix.slice(0,4).map((f,i)=>`<div class="card"><div class="mut">Fecha ${i<2?1:2} ${f[2]?"· Finalizado":"· Programado"}</div><div class="row" style="margin-top:4px"><b class="sp" style="font-size:14px">${esc(f[0])}</b><b>${f[2]?f[2][0]+" - "+f[2][1]:"vs"}</b><b class="sp" style="font-size:14px;text-align:right">${esc(f[1])}</b></div></div>`).join(""):
  `<div class="card"><table><tr><th>#</th><th>Equipo</th><th>Pts</th></tr>${tabla.slice(0,8).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td><b>${r[1]}</b></td></tr>`).join("")}</table></div>`}
  <div class="mut" style="text-align:center;margin-top:6px">Fixture y resultados de ejemplo.</div>`;
},
comm(){
  const seg=`<div class="seg"><button class="${S.cTab==="jug"?"on":""}" onclick="S.cTab='jug';render()">Jugadores</button><button class="${S.cTab==="open"?"on":""}" onclick="S.cTab='open';render()">Partidos abiertos</button><button class="${S.cTab==="msg"?"on":""}" onclick="S.cTab='msg';render()">Chats</button></div>`;
  if(S.cTab==="open")return seg+S.open.map(o=>`<div class="card"><div class="row"><span style="font-size:28px">${SPORTS[o.sport].e}</span><div class="sp"><b style="font-size:14px">${esc(o.title)}</b><div class="mut">${esc(o.where)} · ${o.when}</div></div></div><div class="row" style="margin-top:8px"><span class="tag">${o.lvl}</span><span class="sp"></span><button class="btn sm ${o.joined?"ghost":""}" onclick="joinOpen(${o.id})">${o.joined?"Anotado ✓":"Unirme"}</button></div></div>`).join("");
  if(S.cTab==="msg")return seg+[["team","⚽","Los Pibes de JugáPY","Yo llevo las pecheras."],...S.people.slice(0,2).map(p=>[p.id,"",p.name,"Toca para abrir el chat"])].map(([id,e,n,l])=>`<div class="card row" onclick="openChat('${id}')" style="cursor:pointer"><div class="mini-av" style="background:${id==="team"?"#0f766e":S.people.find(p=>p.id===id)?.c||"#64748b"}">${e||n[0]}</div><div class="sp"><b style="font-size:14px">${esc(n)}</b><div class="mut">${esc((S.chats[id]||[]).slice(-1)[0]?.[1]||l)}</div></div></div>`).join("");
  return seg+S.people.map(p=>`<div class="card row"><div class="mini-av" style="background:${p.c}" onclick="openPlayer(${p.id})">${p.name[0]}</div><div class="sp" onclick="openPlayer(${p.id})" style="cursor:pointer"><b style="font-size:14px">${esc(p.name)}</b><div class="mut">${SPORTS[p.sport].e} ${SPORTS[p.sport].n} · ${p.lvl} · ${esc(p.zone)}</div></div><button class="btn sm ${p.f?"ghost":""}" onclick="follow(${p.id})">${p.f?"Siguiendo":"Seguir"}</button></div>`).join("");
},
player(){
  const p=S.P;
  return `<div class="card" style="text-align:center"><div class="mini-av" style="background:${p.c};width:72px;height:72px;font-size:28px;margin:0 auto 8px">${p.name[0]}</div><h2 style="margin:0">${esc(p.name)}</h2><div class="mut">${SPORTS[p.sport].e} ${SPORTS[p.sport].n} · ${p.lvl} · ${esc(p.zone)}</div><p style="margin:10px 0;font-size:14px">${esc(p.bio)}</p>
  <div class="row"><button class="btn ${p.f?"ghost":""}" onclick="follow(${p.id})">${p.f?"Siguiendo":"Seguir"}</button><button class="btn or" onclick="openChat(${p.id})">Mensaje</button></div></div>`;
},
chat(){
  const id=S.chatWith,name=id==="team"?"Los Pibes de JugáPY":S.people.find(p=>p.id==id).name;
  return `<div class="chat-wrap" style="height:calc(100% )"><div class="mut" style="margin-bottom:8px"><b>${esc(name)}</b>${id==="team"?" · chat de equipo":""}</div><div class="msgs">${(S.chats[id]||[]).map(m=>`<div class="msg ${m[0]==="me"?"me":""}">${esc(m[1])}</div>`).join("")||'<div class="mut">Escribí el primer mensaje</div>'}</div><div class="compose"><input type="text" id="mi" placeholder="Escribí un mensaje…" onkeydown="if(event.key==='Enter')send()"><button class="btn sm" onclick="send()">Enviar</button></div></div>`;
},
profile(){
  const tabs=`<div class="seg"><button class="${S.pTab==="res"?"on":""}" onclick="S.pTab='res';render()">Reservas${S.bookings.length?`<span class="badge">${S.bookings.length}</span>`:""}</button><button class="${S.pTab==="eq"?"on":""}" onclick="S.pTab='eq';render()">Equipos</button><button class="${S.pTab==="val"?"on":""}" onclick="S.pTab='val';render()">Valoraciones</button></div>`;
  let body="";
  if(S.pTab==="res")body=S.bookings.length?S.bookings.map(b=>`<div class="card"><b>${esc(b.name)}</b><div class="mut">${b.label} · ${b.h}:00 hs · Seña ${gs(b.seña)}</div><div class="row" style="margin-top:6px"><span class="tag">Código ${b.code}</span><span class="sp"></span><button class="btn sm ghost" onclick="cancelB('${b.code}')">Cancelar reserva</button></div></div>`).join(""):`<div class="card mut">Aún no hiciste reservas.</div>`;
  if(S.pTab==="eq")body=`<div class="card row"><div class="mini-av" style="background:#0f766e">⚽</div><div class="sp"><b>Los Pibes de JugáPY</b><div class="mut">Fútbol 5 · 8 integrantes</div></div></div><div class="card row"><div class="mini-av" style="background:#ea580c">🎾</div><div class="sp"><b>Dupla Pádel Sajonia</b><div class="mut">Pádel · 2 integrantes</div></div></div>${S.joinedT.length?`<h3>Torneos inscriptos</h3>`+S.joinedT.map(id=>`<div class="card"><b>${esc(TOURN0.find(t=>t.id===id).name)}</b></div>`).join(""):""}`;
  if(S.pTab==="val")body=`<div class="card"><div class="row"><b>Puntualidad</b><span class="sp"></span><span class="stars">★★★★★</span></div></div><div class="card"><div class="row"><b>Juego limpio</b><span class="sp"></span><span class="stars">★★★★☆</span></div></div><div class="card"><div class="row"><b>Trabajo en equipo</b><span class="sp"></span><span class="stars">★★★★★</span></div></div>`;
  return `<div class="card" style="text-align:center"><div class="mini-av" style="background:#0f766e;width:72px;height:72px;font-size:26px;margin:0 auto 8px">${ini(S.user.name)}</div><h2 style="margin:0">${esc(S.user.name)}</h2><div class="mut">${esc(S.user.mail)}${S.user.sport?" · "+esc(S.user.sport):""}</div><div class="row" style="justify-content:center;margin-top:10px;gap:22px"><div><b>${S.people.filter(p=>p.f).length}</b><div class="mut">Siguiendo</div></div><div><b>128</b><div class="mut">Seguidores</div></div><div><b>${24+S.bookings.length}</b><div class="mut">Partidos</div></div></div></div>${tabs}${body}<button class="btn ghost" style="margin-top:14px" onclick="logout()">Cerrar sesión</button>`;
},
};

/* ============ ACCIONES ============ */
function auth(){
  const up=S.aTab==="up",g=i=>($(i)?$(i).value.trim():"");
  const f={name:g("#f-name"),mail:g("#f-mail"),pass:($("#f-pass")||{}).value||"",sport:g("#f-sport")};S.form=f;S.err={};
  if(up&&f.name.length<3)S.err.name="Ingresá tu nombre y apellido.";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.mail))S.err.mail="Ingresá un correo válido (ej.: nombre@correo.com).";
  if(f.pass.length<6)S.err.pass="La contraseña debe tener al menos 6 caracteres.";
  if(up&&!f.sport)S.err.sport="Elegí tu deporte favorito.";
  if(Object.keys(S.err).length){render();return}
  const nm=up?f.name:f.mail.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
  S.user={name:nm,mail:f.mail,sport:up?f.sport:""};S.form=null;S.stack=[];S.screen="home";render();
}
function logout(){S.user=null;S.stack=[];S.aTab="in";render()}
function cancelB(code){const i=S.bookings.findIndex(b=>b.code===code);if(i>=0){S.bookings.splice(i,1);toast("Reserva cancelada. La franja vuelve a estar disponible")}render()}
function upd(){const list=COURTS.filter(c=>(S.sport==="all"||c.sport===S.sport)&&(c.name+c.zone).toLowerCase().includes(S.q.toLowerCase()));$("#list").innerHTML=list.length?list.map(courtCard).join(""):`<div class="card mut">No hay canchas que coincidan con tu búsqueda.</div>`}
function openCourt(id){S.court=COURTS.find(c=>c.id===id);go("court")}
function confirmPay(){
  const c=S.court,d=dayDate(S.day);
  if(busy(c.id,S.day,S.slot)){toast("Esa franja ya fue reservada. Elegí otra.");S.slot=null;S.screen="book";render();return}
  const code="JP-"+(1000+Math.floor(Math.random()*9000));
  S.bookings.push({cid:c.id,day:S.day,h:S.slot,name:c.name,label:DN[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1),code,seña:Math.round(c.price*.3)});
  S.stack=["courts"];S.screen="done";render();
}
function openT(id){S.T=S.tourn.find(t=>t.id===id);S.tab="fixture";go("tourn")}
function joinT(id){const t=S.tourn.find(x=>x.id===id);if(t.taken>=t.cap)return;t.taken++;S.joinedT.push(id);S.T=t;toast("Inscripción realizada (pago de cuota simulado)");render()}
function follow(id){const p=S.people.find(x=>x.id===id);p.f=!p.f;toast(p.f?"Ahora seguís a "+p.name:"Dejaste de seguir a "+p.name);if(S.P&&S.P.id===id)S.P=p;render()}
function openPlayer(id){S.P=S.people.find(p=>p.id===id);go("player")}
function joinOpen(id){const o=S.open.find(x=>x.id===id);o.joined=!o.joined;o.need+=o.joined?-1:1;o.title=o.title.replace(/falta[n]? \d+/,(o.need===1?"falta ":"faltan ")+o.need);toast(o.joined?"Te anotaste al partido":"Saliste del partido");render()}
function openChat(id){S.chatWith=String(id)==="team"?"team":Number(id);go("chat")}
const REPLIES=["¡Dale, genial! 👍","Perfecto, nos vemos ahí.","Confirmado ✅","¿A qué hora te queda mejor?","Joya, avisame cualquier cosa."];
function send(){
  const i=$("#mi"),v=i.value.trim();if(!v)return;
  const id=S.chatWith;(S.chats[id]=S.chats[id]||[]).push(["me",v]);render();
  setTimeout(()=>{if(S.screen==="chat"&&S.chatWith===id){S.chats[id].push(["them",REPLIES[Math.floor(Math.random()*REPLIES.length)]]);render()}},900);
}
render();
</script>
</body>
</html>
